name: Build Alam Video Editor Pro V3

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Save custom Kotlin activity
        shell: bash
        run: |
          set -euo pipefail
          src=android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt
          test -f "$src"
          cp "$src" /tmp/AlamMainActivity.kt

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --org com.alam --project-name alam_video_editor_pro .
          mkdir -p android/app/src/main/kotlin/com/alam/videoeditor
          cp /tmp/AlamMainActivity.kt android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:name=".MainActivity"','android:name="com.alam.videoeditor.MainActivity"')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure SDK and desugaring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle.kts')
          if not p.exists():
              raise SystemExit('Expected Kotlin Gradle file is missing')
          s=p.read_text()
          s,n=re.subn(r'(?m)^\s*compileSdk\s*=\s*[^\r\n]+', '    compileSdk = 36', s, count=1)
          if n != 1: raise SystemExit('Could not locate compileSdk assignment')
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s,n=re.subn(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
              if n != 1: raise SystemExit('Could not locate compileOptions block')
          dep='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dep not in s:
              s+='\ndependencies {\n    '+dep+'\n}\n'
          p.write_text(s)
          print('Configured:',next(x.strip() for x in s.splitlines() if 'compileSdk =' in x))
          PY

      - name: Generate launcher icon
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/icon/app_icon.png
          dart run flutter_launcher_icons

      - name: Verify SDK setting
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'compileSdk = 36' android/app/build.gradle.kts
          grep -n 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -n 'desugar_jdk_libs:2.1.4' android/app/build.gradle.kts
          flutter --version

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build test AAB
        run: flutter build appbundle --release --no-pub

      - name: Upload test AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-Test-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
