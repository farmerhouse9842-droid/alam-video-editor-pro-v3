
name: Build Alam Video Editor Pro V3

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup Native Android Files
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/alam_native

          NATIVE="android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt"

          if [ ! -f "$NATIVE" ]; then
            echo "ERROR: MainActivity.kt missing"
            exit 1
          fi

          cp "$NATIVE" /tmp/alam_native/MainActivity.kt

      - name: Generate Clean Android Project
        shell: bash
        run: |
          set -e
          rm -rf android

          flutter create \
            --platforms=android \
            --org com.alam \
            --project-name alam_video_editor_pro \
            .

      - name: Restore Native Video Editor
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/alam/videoeditor

          cp /tmp/alam_native/MainActivity.kt \
            android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:name=".MainActivity"',
              'android:name="com.alam.videoeditor.MainActivity"'
          )

          manifest.write_text(text)
          PY

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Fix Android Gradle Configuration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("build.gradle.kts not found")

          text = path.read_text()

          text, count = re.subn(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not configure compileSdk"
              )

          if "isCoreLibraryDesugaringEnabled" not in text:
              text, count = re.subn(
                  r'compileOptions\s*\{',
                  'compileOptions {\n'
                  '        isCoreLibraryDesugaringEnabled = true',
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "compileOptions block not found"
                  )

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if dependency not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  text += (
                      "\ndependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          path.write_text(text)
          print("Android SDK 36 and desugaring configured")
          PY

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate App Icon
        shell: bash
        run: |
          set -e

          if [ ! -f assets/icon/app_icon.png ]; then
            echo "ERROR: assets/icon/app_icon.png missing"
            exit 1
          fi

          dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Test AAB
        run: flutter build appbundle --release

      - name: Upload Test AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-Test-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
