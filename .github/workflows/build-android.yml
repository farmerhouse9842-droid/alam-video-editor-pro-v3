
name: Build Alam Video Editor Pro V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup Native Android Files
        run: |
          mkdir -p /tmp/alam_native

          NATIVE="android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt"

          if [ ! -f "$NATIVE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          cp "$NATIVE" /tmp/alam_native/MainActivity.kt

      - name: Generate Clean Android Project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --org com.alam \
            --project-name alam_video_editor_pro \
            .

      - name: Restore Native Video Editor
        run: |
          mkdir -p android/app/src/main/kotlin/com/alam/videoeditor

          cp /tmp/alam_native/MainActivity.kt \
            android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace(
              'android:name=".MainActivity"',
              'android:name="com.alam.videoeditor.MainActivity"'
          )
          manifest.write_text(text)
          PY

      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "isCoreLibraryDesugaringEnabled" not in text:
              text = text.replace(
                  "compileOptions {",
                  "compileOptions {\n"
                  "        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if dependency not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  text += (
                      "\ndependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          path.write_text(text)
          PY

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: |
          if [ -f assets/icon/app_icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "ERROR: App icon missing"
            exit 1
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Test AAB
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-Test-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
