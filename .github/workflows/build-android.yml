
name: Build Alam Video Editor Pro V3

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup Kotlin MainActivity
        shell: bash
        run: |
          set -e
          NATIVE="android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt"
          test -f "$NATIVE" || {
            echo "MainActivity.kt missing"
            exit 1
          }
          cp "$NATIVE" /tmp/AlamMainActivity.kt

      - name: Generate Clean Android Project
        shell: bash
        run: |
          set -e
          rm -rf android
          flutter create --platforms=android \
            --org com.alam \
            --project-name alam_video_editor_pro .

      - name: Restore Native Video Editor
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/kotlin/com/alam/videoeditor
          cp /tmp/AlamMainActivity.kt \
            android/app/src/main/kotlin/com/alam/videoeditor/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace(
              'android:name=".MainActivity"',
              'android:name="com.alam.videoeditor.MainActivity"'
          )
          p.write_text(s)
          PY

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configure Android SDK and Desugaring
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s, n = re.subn(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("compileSdk setting missing")

          if "isCoreLibraryDesugaringEnabled" not in s:
              s, n = re.subn(
                  r'compileOptions\s*\{',
                  'compileOptions {\n'
                  '        isCoreLibraryDesugaringEnabled = true',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("compileOptions missing")

          dep = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )
          if dep not in s:
              s += "\ndependencies {\n    " + dep + "\n}\n"

          p.write_text(s)
          PY

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate App Icon
        shell: bash
        run: |
          set -e
          test -f assets/icon/app_icon.png
          dart run flutter_launcher_icons

      - name: Verify Compile SDK Before Build
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s, n = re.subn(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("compileSdk not found")

          p.write_text(s)
          print("Final compileSdk configuration:")
          for line in s.splitlines():
              if "compileSdk =" in line:
                  print(line.strip())
          PY

          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Test AAB
        run: flutter build appbundle --release

      - name: Upload Test AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Video-Editor-Pro-V3-Test-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
